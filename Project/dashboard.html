<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!--  NAVBAR  -->

    <nav class="navbar">

        <h2 class="logo">AlumniConnect</h2>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="mentors.html">Mentors</a></li>

            <li><a href="booking.html">Bookings</a></li>

            <li><a href="forum.html">Forum</a></li>

            <li><a href="dashboard.html" class="active">Dashboard</a></li>

        </ul>

    </nav>

    <!--  HEADER  -->

    <section class="page-header">

        <h1>Dashboard</h1>

        <p>

            View platform statistics and recent activity.

        </p>

    </section>

    <!--  STATS  -->

    <section class="stats-container">

        <div class="stat-card">

            <h2 id="mentorCount">0</h2>

            <p>Total Mentors</p>

        </div>

        <div class="stat-card">

            <h2 id="bookingCount">0</h2>

            <p>Total Bookings</p>

        </div>

        <div class="stat-card">

            <h2 id="forumCount">0</h2>

            <p>Forum Posts</p>

        </div>

    </section>

    <!-- RECENT BOOKINGS  -->

    <section class="dashboard-section">

        <h2>Recent Bookings</h2>

        <div id="bookingList" class="list-container">

            <!-- JavaScript will populate bookings -->

        </div>

    </section>

    <!--  RECENT DISCUSSIONS  -->

    <section class="dashboard-section">

        <h2>Recent Discussions</h2>

        <div id="forumList" class="list-container">

            <!-- JavaScript will populate forum posts -->

        </div>

    </section>

    <!--  FOOTER  -->

    <footer>

        <p>

            © 2026 AlumniConnect | Dashboard

        </p>

    </footer>

    <script src="js/dashboard.js"></script>

</body>

</html>
