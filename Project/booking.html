<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Session</title>

    <link rel="stylesheet" href="css/booking.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <h2 class="logo">AlumniConnect</h2>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="mentors.html">Mentors</a></li>

            <li><a href="booking.html" class="active">Bookings</a></li>

            <li><a href="forum.html">Forum</a></li>

            <li><a href="dashboard.html">Dashboard</a></li>

        </ul>

    </nav>

    <!-- ================= PAGE HEADER ================= -->

    <section class="page-header">

        <h1>Book a Mentorship Session</h1>

        <p>
            Fill in the details below to schedule your session.
        </p>

    </section>

    <!-- ================= BOOKING FORM ================= -->

    <section class="booking-section">

        <form id="bookingForm" class="booking-form">

            <div class="input-box">

                <label>Select Mentor</label>

                <select id="mentorName" required>

                    <option value="">Choose a Mentor</option>

                    <option value="Rahul Sharma">Rahul Sharma</option>
                    <option value="Priya Mehta">Priya Mehta</option>
                    <option value="Aman Verma">Aman Verma</option>
                    <option value="Neha Kapoor">Neha Kapoor</option>
                    <option value="Arjun Singh">Arjun Singh</option>
                    <option value="Sneha Gupta">Sneha Gupta</option>

                </select>

            </div>

            <div class="input-box">

                <label>Student Name</label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required
                >

            </div>

            <div class="input-box">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="input-box">

                <label>Select Date</label>

                <input
                    type="date"
                    id="date"
                    required
                >

            </div>

            <div class="input-box">

                <label>Select Time</label>

                <select id="time" required>

                    <option value="">Choose Time Slot</option>

                    <option>10:00 AM</option>
                    <option>11:00 AM</option>
                    <option>12:00 PM</option>
                    <option>2:00 PM</option>
                    <option>3:00 PM</option>
                    <option>4:00 PM</option>

                </select>

            </div>

            <div class="input-box">

                <label>Purpose of Meeting</label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Describe what you'd like help with..."
                    required
                ></textarea>

            </div>

            <button type="submit" class="submit-btn">

                Confirm Booking

            </button>

        </form>

    </section>

    <!-- ================= SUCCESS MESSAGE ================= -->

    <div id="successMessage" class="success-message">

        ✅ Booking Request Sent Successfully!

    </div>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 AlumniConnect | Learn • Connect • Grow

        </p>

    </footer>

    <script src="js/booking.js"></script>

</body>

</html>
